<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روز نگار بهدینان</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- کتابخانه‌های فایربیس -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1>روز نگار بهدینان</h1>
        </div>
        
        <!-- منوی میانبر ۱۲ ماه -->
        <div class="months-nav-bar">
            <a href="#month-0" class="month-nav-btn">فروردین</a>
            <a href="#month-1" class="month-nav-btn">اردیبهشت</a>
            <a href="#month-2" class="month-nav-btn">خرداد</a>
            <a href="#month-3" class="month-nav-btn">تیر</a>
            <a href="#month-4" class="month-nav-btn">امرداد</a>
            <a href="#month-5" class="month-nav-btn">شهریور</a>
            <a href="#month-6" class="month-nav-btn">مهر</a>
            <a href="#month-7" class="month-nav-btn">آبان</a>
            <a href="#month-8" class="month-nav-btn">آذر</a>
            <a href="#month-9" class="month-nav-btn">دی</a>
            <a href="#month-10" class="month-nav-btn">بهمن</a>
            <a href="#month-11" class="month-nav-btn">اسفند</a>
        </div>
        
        <div id="calendar-container"></div>
        
        <button id="admin-btn" class="admin-login-btn" onclick="toggleAdmin()">ورود مدیر</button>
    </div>

    <!-- پنجره پاپ‌آپ -->
    <div id="note-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modal-day-title">یادداشت‌های روز</h3>
            <div id="modal-day-date" class="modal-date"></div>
            
            <div id="notes-list" class="notes-list-container"></div>

            <hr class="modal-divider">

            <div class="add-note-form">
                <h4>افزودن یادداشت جدید:</h4>
                <input type="text" id="author-input" placeholder="نام و نام خانوادگی (اجباری)" class="modal-input">
                <textarea id="note-input" placeholder="یادداشت خود را بنویسید..." class="modal-textarea"></textarea>
                <button class="save-btn" onclick="saveNote()">ثبت یادداشت</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
